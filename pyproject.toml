[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-incident-lab"
version = "0.1.0"
description = "Local evidence-attestation incident ledger prototype"
requires-python = ">=3.9"

[project.scripts]
incidentlab = "incidentlab:main"
incidentlab-install = "incidentlab_install:main"

[tool.setuptools]
py-modules = ["incidentlab", "incidentlab_install"]
